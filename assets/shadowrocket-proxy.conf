# Shadowrocket 普通代理 wrapper。
# 导入本文件后，General、Rule 和 Host 来自共享配置，代理分组只选择以 proxy: 开头的节点。

[General]
# include 建立配置包含关系；当前文件中的同名设置优先于被包含文件。
include=shadowrocket-common.conf

[Proxy Group]
# url-test 会定期探测候选节点，并自动选择延迟最低且可用的节点。
# interval=600 表示每 600 秒重测；timeout=5 表示单次测试 5 秒超时。
# tolerance=0 表示新节点只要测试结果更优即可切换；select=0 默认选择第一个候选项。
# policy-regex-filter 以大小写不敏感的字符组匹配节点备注中的 proxy: 前缀。
# Shadowrocket 的 url-test 对 HTTPS 测试地址存在兼容性 BUG，因此测试 URL 必须使用 HTTP。
PROXY = url-test,url=http://www.gstatic.com/generate_204,interval=600,tolerance=0,timeout=5,select=0,policy-regex-filter=^[pP][rR][oO][xX][yY]:
