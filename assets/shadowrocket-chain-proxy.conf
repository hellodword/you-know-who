# Shadowrocket 链式代理 wrapper。
# 以 chain: 开头的 VMess 是落地节点：订阅链接为其设置 chain=CHAIN，并且不设置 mux。
# CHAIN 分组选择名称中带有“【”的中转节点，落地节点会先通过该中转节点建立连接。

[General]
# include 复用普通代理配置相同的 General、Rule 和 Host。
include=shadowrocket-common.conf

[Proxy Group]
# PROXY 对 chain: 落地节点执行 url-test，并把胜出的落地节点用于共享分流规则。
# interval、timeout、tolerance 和 select 的含义与普通代理 wrapper 相同。
# policy-regex-filter 以大小写不敏感的字符组匹配节点备注中的 chain: 前缀。
# Shadowrocket 的 url-test 对 HTTPS 测试地址存在兼容性 BUG，因此测试 URL 必须使用 HTTP。
PROXY = url-test,url=http://www.gstatic.com/generate_204,interval=600,tolerance=0,timeout=5,select=0,policy-regex-filter=^[cC][hH][aA][iI][nN]:

# CHAIN 是手动选择分组。名称包含“【”的节点视为中转节点，并供 VMess 的 chain=CHAIN 引用。
# 如果不存在匹配的中转节点，链式落地节点将无法按预期完成代理链连接。
CHAIN = select,policy-regex-filter=【
